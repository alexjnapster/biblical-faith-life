name: Validate plugin source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node hosted-research/test-service.mjs
      - run: node hosted-research/test-public-service.mjs
      - run: python tools/build_release.py --output /tmp/bfl-release
